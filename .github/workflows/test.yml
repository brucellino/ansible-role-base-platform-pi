---
name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Get Mise
        uses: jdx/mise-action@v5
        with:
          install: true
          experimental: true
      - name: Lint
        run: ansible-lint .
      - name: Initialise Packer
        working-directory: test
        run: mise exec -- packer init .
  release:
    needs:
      - test
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Add tools
        uses: jdx/mise-action@v5
        with:
          install: true
      - name: Set up releaser info
        run: |
          git config user.name "${GITHUB_ACTOR}[bot]"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semrel release
